name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint (Firefox add-on rules)
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (extension loaded in Chromium, mocked sites)
        run: npm run test:e2e
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
      - name: Build zip
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: detour-build
          path: dist/*.zip
