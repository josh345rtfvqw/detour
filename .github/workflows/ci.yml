name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['data/**'] # list data updates don't need a CI run
  pull_request:

# Read-only token: CI only tests and builds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint (Firefox add-on rules)
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (extension loaded in Chromium, mocked sites)
        run: npm run test:e2e
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
      - name: Build zip
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detour-build
          path: dist/*.zip
