name: Update known-videos list

# Rebuilds the master list in data/ (served at https://josh345rtfvqw.github.io/detour/data/):
# known.json plus per-creator catalogues in data/nebula/ and data/floatplane/. The first run
# pulls every creator's whole history; daily runs only fetch videos newer than what's stored.
# Commits when anything changes; GitHub Pages then republishes it.
# Runs daily, on demand, and when the hand-edited data files change.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/floatplane-creators.json
      - data/overrides.json
      - scripts/build-known.js
      - match.js

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # the first (full) run takes longest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build on the latest main (with the newest data), not the commit that triggered the run.
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the list
        run: node scripts/build-known.js
      - name: Commit if changed
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update known-videos list"
          # main may have moved while the build ran (e.g. a code push): rebase onto it first. If
          # data files conflict, this run's freshly built data wins ("theirs" = the commit being
          # replayed during a rebase).
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
