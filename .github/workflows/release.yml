name: Release

# Two ways to publish a release:
#  1. Actions tab -> Release -> "Run workflow" on main. Tags the commit as
#     v<manifest version> and publishes the release.
#  2. Push a tag like v0.2.0 (matching "version" in manifest.json).
# Either way the tests run first and the built zip is attached to the release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the tag
        id: tag
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "v$manifest" != "$tag" ]; then
              echo "::error::Tag $tag does not match manifest.json version $manifest"
              exit 1
            fi
          else
            tag="v$manifest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
      - name: Build zip
        id: build
        run: echo "zip=$(npm run --silent build)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its zip"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Detour $TAG" --generate-notes
          fi
